<ion-content [fullscreen]="true">
  <div class="container">
    <div class="intro">
      <ion-icon name="flask"></ion-icon>
      <h1>nassau<span>Tickets</span></h1>

      <p>Área do atendente</p>
    </div>

    <!-- Campo de usuário -->
    <ion-item>
      <ion-input
        label="Usuário"
        labelPlacement="stacked"
        placeholder="Digite seu usuário"
        type="text"
        [(ngModel)]="usuario"
      >
      </ion-input>
    </ion-item>

    <!-- Campo de senha -->
    <ion-item>
      <ion-input
        label="Senha"
        labelPlacement="stacked"
        placeholder="Digite sua senha"
        type="password"
        [(ngModel)]="senha"
      >
      </ion-input>
    </ion-item>

    <!-- Botões -->
    <div class="actions">
      <ion-button (click)="entrar()"> Entrar </ion-button>

      <ion-button fill="clear" (click)="esqueciSenha()">Esqueci minha senha</ion-button>
    </div>
  </div>
</ion-content>
